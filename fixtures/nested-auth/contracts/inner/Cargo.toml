[package]
name = "authmatrix-inner"
description = "AuthMatrix fixture: records a SEP-41-shaped transfer after requiring the sender's authorization. Holds no balances. Not a token, not for production."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
